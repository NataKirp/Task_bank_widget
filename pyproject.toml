[project]
name = "task-bank-widget"
version = "0.1.0"
description = ""
authors = [
    {name = "Natalya Kirpichnikova",email = "kirpichnikova.nb@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.1.0,<27.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "mypy (>=1.19.1,<2.0.0)"
]

[black]
line-length = 119
exclude = '\.git'

[isort]
line_length = 119
force_single_line = true

[mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'